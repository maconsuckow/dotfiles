# Which is equivalent to
# format = '$all$directory$character'
add_newline = true

format = """$os$read_only$directory$character"""

right_format = "$hostname$git_branch$time"

palette = "gruvbox_material"

[palettes.gruvbox_material]
fg     = "#d4be98"
bg     = "#282828"
red    = "#ea6962"
orange = "#e78a4e"
yellow = "#d8a657"
green  = "#a9b665"
aqua   = "#89b482"
blue   = "#7daea3"
purple = "#d3869b"
grey   = "#928374"

[os]
disabled = false
style = "bold fg"
format = "[$symbol]($style)"

[os.symbols]
Macos = " "

[character]
success_symbol = '[➜ ](bold green)'
error_symbol   = '[➜ ](bold red)'

[directory]
style = "bold blue"
read_only_style = "red"

[hostname]
style = "bold aqua"

[git_branch]
style = "bold purple"

[time]
disabled = false
style = "grey"

[gcloud]
