set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.config/tmux/plugins'

bind R source-file ~/.config/tmux/tmux.conf; display-message "Config reloaded..."

set -g default-terminal "tmux-256color"
# set-option -sa terminal-features ',xterm-256color:RGB'
# set -g default-terminal "screen-256color"
set-option -sa terminal-overrides ",xterm*:Tc"

# remap prefix from 'C-b' to 'C-a'
unbind C-Space
set-option -g prefix C-b
bind-key C-b send-prefix

# split panes using | and -
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
unbind '"'
unbind %

# Quick layout bindings
# Prefix + P: Setup standard project windows (app, db, gemini)
bind P run-shell "tmux new-window -n app; tmux new-window -n db; tmux new-window -n gemini 'gemini'"

# Prefix + G: Just a quick Gemini window
bind G new-window -n gemini "gemini"

# switch panes using Alt-arrow without prefix
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

set -g @plugin 'tmux-plugins/tpm'

# set -g @plugin 'tmux-plugins/tmux-cpu'

set -g @plugin 'tmux-plugins/tmux-mode-indicator'
# set -g @plugin 'catppuccin/tmux'
# set -g @plugin 'Nybkox/tmux-kanagawa'

tmux_dir="~/.config/tmux"
source "~/.config/tmux/utils/theme.conf"

# You might also need to explicitly set these to default

# # Configure Online
set -g @online_icon "ok"
set -g @offline_icon "nok"

# Configure tmux-mode-indicator
set -g @mode_indicator_prefix_prompt " WAIT "
set -g @mode_indicator_prefix_mode_style "bg=#{@gruvbox_orange},fg=#{@gruvbox_bg},bold"
set -g @mode_indicator_copy_prompt " COPY "
set -g @mode_indicator_copy_mode_style "bg=#{@gruvbox_yellow},fg=#{@gruvbox_bg},bold"
set -g @mode_indicator_sync_prompt " SYNC "
set -g @mode_indicator_sync_mode_style "bg=#{@gruvbox_red},fg=#{@gruvbox_bg},bold"
set -g @mode_indicator_empty_prompt " TMUX "
set -g @mode_indicator_empty_mode_style "bg=#{@gruvbox_blue},fg=#{@gruvbox_bg},bold"

# Ability to use mouse
set -g mouse on

# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1

set -g escape-time 50

set -g status-style "fg=#{@gruvbox_gray},bg=default"

# status left look and feel
set -g status-left-length 100
set -g status-left "#[fg=#{?client_prefix,#{@gruvbox_orange},#{@gruvbox_dark_gray}},bg=default]#[fg=#{@gruvbox_fg},bg=#{?client_prefix,#{@gruvbox_orange},#{@gruvbox_dark_gray}}] #S #[fg=#{?client_prefix,#{@gruvbox_orange},#{@gruvbox_dark_gray}},bg=default]"
set -ga status-left " "
set -ga status-left "#{tmux_mode_indicator}"

# status right look and feel
set -g status-right-length 100
set -g status-right ""





# Configure Tmux
set -g status-position top
set -g status 2
set -g 'status-format[1]' ""
# set -g status-justify absolute-centre
set -g status-justify right

# pane border look and feel
set -g pane-border-status off
set -g pane-border-format ""
set -g pane-border-lines single

# window look and feel
set -wg automatic-rename on
# set -g automatic-rename-format "Window"

# #I is the index of window
set -g window-status-format ""
set -g window-status-format "#[fg=#{@gruvbox_dark_gray},bg=default]"
set -ga window-status-format "#[fg=#{@gruvbox_fg},bg=#{@gruvbox_dark_gray}] #I#{?#{!=:#{window_name},},: #W,}"
set -ga window-status-format " #[fg=#{@gruvbox_dark_gray},bg=default]"
set -g window-status-style "NONE" # We are setting colors manually within the format string, so this can be "NONE" or your default

set -gF window-status-separator " "

set -g window-status-current-format ""
set -g window-status-current-format "#[fg=#{@gruvbox_green}]"
set -ga window-status-current-format "#[fg=#{@gruvbox_bg},bg=#{@gruvbox_green},bold] #I#{?#{!=:#{window_name},Window},: #W,}"
set -ga window-status-current-format " #[fg=#{@gruvbox_green},bg=default]"
set -g window-status-current-style "NONE" # Same as above, manual coloring

set -g message-command-style "bg=default,fg=#{@gruvbox_yellow}"
set -g message-style "bg=default,fg=#{@gruvbox_yellow}"

# bootstrap tpm
if "test ! -d ~/.config/tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.config/tmux/plugins/tpm && ~/.config/tmux/plugins/tpm/bin/install_plugins'"

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.config/tmux/plugins/tpm/tpm'
